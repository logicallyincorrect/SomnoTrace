name: Host tests

on:
  push:
    paths:
      - "main/**"
      - "components/**"
      - "scripts/**"
      - "third_party/**"
      - ".github/workflows/host-tests.yml"
  pull_request:
    paths:
      - "main/**"
      - "components/**"
      - "scripts/**"
      - "third_party/**"
      - ".github/workflows/host-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install libcjson
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libcjson-dev
      - name: Run host behavior and architecture tests
        run: |
          set -o pipefail
          bash scripts/test-host.sh | tee host-tests.log
          grep -qE '^host tests: [0-9]+ run, 0 failed, 0 skipped$' host-tests.log
          grep -q '^All synthetic host tests passed$' host-tests.log
